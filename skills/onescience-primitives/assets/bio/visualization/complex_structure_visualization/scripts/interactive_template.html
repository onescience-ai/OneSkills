    function hydrateAtoms() {
      const atoms = model.selectedAtoms({});
      const metadataQueues = new Map();
      atomMetadata.forEach((metadata, metadataIndex) => {
        const key = [
          String(metadata.c || "_"),
          String(metadata.i ?? ""),
          String(metadata.r || ""),
          String(metadata.a || "")
        ].join("|");
        if (!metadataQueues.has(key)) metadataQueues.set(key, []);
        metadataQueues.get(key).push({ metadata, metadataIndex });
      });
      const usedMetadata = new Set();
      let mappedCount = 0;
      atoms.forEach((atom, fallbackIndex) => {
        const key = [
          String(atom.chain || "_"),
          String(atom.resi ?? ""),
          String(atom.resn || ""),
          String(atom.atom || "")
        ].join("|");
        const queue = metadataQueues.get(key) || [];
        let entry = queue.find(item => !usedMetadata.has(item.metadataIndex));
        if (!entry) {
          const index = Number.isInteger(atom.index) ? atom.index : fallbackIndex;
          if (atomMetadata[index] && !usedMetadata.has(index)) {
            entry = { metadata: atomMetadata[index], metadataIndex: index };
          }
        }
        const metadata = entry && entry.metadata;
        if (!metadata) return;
        usedMetadata.add(entry.metadataIndex);
        mappedCount += 1;
        atom.atom = metadata.a || atom.atom;
        atom.resn = metadata.r || atom.resn;
        atom.chain = metadata.c || atom.chain;
        atom.resi = metadata.i !== null && metadata.i !== undefined
          ? metadata.i
          : atom.resi;
        atom.properties = {
          ...(atom.properties || {}),
          role: metadata.role,
          entityId: metadata.e,
          plddt: Number.isFinite(Number(metadata.p))
            ? Number(metadata.p)
            : null,
          atomPlddt: Number.isFinite(Number(metadata.ap))
            ? Number(metadata.ap)
            : null
        };
      });
      mappedAtomFraction = atoms.length ? mappedCount / atoms.length : 0;
    }

    function collectSecondaryStructureInfo() {
      const residueAssignments = new Map();
      const nucleicResidueAtoms = new Map();
      model.selectedAtoms({}).forEach(atom => {
        const role = atom.properties && atom.properties.role;
        if (role === "protein") {
          const key = residueKey(atom);
          const raw = String(atom.ss || "c").toLowerCase();
          const assignment = raw === "h" ? "h" : raw === "s" ? "s" : "c";
          const existing = residueAssignments.get(key);
          if (!existing || (existing === "c" && assignment !== "c")) {
            residueAssignments.set(key, assignment);
          }
        } else if (role === "dna" || role === "rna") {
          const base = canonicalBase(atom.resn);
          if (!base) return;
          const key = residueKey(atom);
          if (!nucleicResidueAtoms.has(key)) {
            nucleicResidueAtoms.set(key, { base, atoms: new Set() });
          }
          nucleicResidueAtoms.get(key).atoms.add(
            String(atom.atom || "").toUpperCase()
          );
        }
      });

      const counts = { h: 0, s: 0, c: 0 };
      residueAssignments.forEach(assignment => {
        counts[assignment] += 1;
      });
      let incompleteNucleicResidues = 0;
      nucleicResidueAtoms.forEach(residue => {
        const expected = ringAtomNames(residue.base);
        let observed = 0;
        residue.atoms.forEach(atomName => {
          if (expected.has(atomName)) observed += 1;
        });
        if (observed < 5) incompleteNucleicResidues += 1;
      });

      const proteinResidues = residueAssignments.size;
      const assignedResidues = counts.h + counts.s;
      const statusValue = !proteinResidues
        ? "not-applicable"
        : assignedResidues
          ? "assigned"
          : proteinResidues <= 8
            ? "short-fragment-all-coil"
            : "warning-all-coil";
      const details = {
        status: statusValue,
        source:
          runtimeConfig.structure_diagnostics &&
          runtimeConfig.structure_diagnostics.secondary_structure_source
            ? runtimeConfig.structure_diagnostics.secondary_structure_source
            : "3dmol-2.5.4:coordinate_inference",
        protein_residues: proteinResidues,
        counts,
        nucleic_residues: nucleicResidueAtoms.size,
        incomplete_nucleic_residues: incompleteNucleicResidues
      };
      root.dataset.secondaryStructureStatus = details.status;
      root.dataset.secondaryStructureCounts = JSON.stringify(details.counts);
      root.dataset.renderer = "3dmol-2.5.4";
      return details;
    }

    function representationWarnings(config, nucleicStats) {
      if (config.visualPreset !== "rcsb" || !secondaryStructureInfo) return [];
      const warnings = [];
      if (secondaryStructureInfo.status === "warning-all-coil") {
        warnings.push("未识别到 α/β 二级结构，当前按 coil 显示");
      } else if (secondaryStructureInfo.status === "short-fragment-all-coil") {
        warnings.push("短肽缺少稳定二级结构，默认按 coil 显示；可在自定义视图选择 sticks");
      }
      if (
        secondaryStructureInfo.incomplete_nucleic_residues > 0 &&
        nucleicStats.slabCount === 0
      ) {
        warnings.push(
          `${secondaryStructureInfo.incomplete_nucleic_residues} 个核苷酸缺少完整环原子，无法生成 slab`
        );
      }
      return warnings;
    }

    function handleAtomSelection(atom) {
      activateDynamicBonds(atom);
    }

    function loadSample(sampleId, preserveCamera = true) {
      const sampleIndex = viewerPayload.samples.findIndex(
        sample => sample.id === sampleId
      );
      if (sampleIndex < 0) throw new Error(`找不到样本 ${sampleId}`);
      resetDynamicBondUi();
      clearSequenceHighlight();
      if (model) {
        clearScene();
        if (typeof viewer.removeModel === "function") {
          viewer.removeModel(model);
        } else if (typeof viewer.removeAllModels === "function") {
          viewer.removeAllModels();
        }
      }
      activeSampleIndex = sampleIndex;
      assignSample(viewerPayload.samples[sampleIndex]);
      sampleSelect.value = activeSample.id;
      model = viewer.addModel(structureData, format, {
        noComputeSecondaryStructure: false
      });
      hydrateAtoms();
      secondaryStructureInfo = collectSecondaryStructureInfo();
      viewer.setClickable({}, true, handleAtomSelection);
      viewer.setHoverDuration(55);
      viewer.setHoverable(
        {
          predicate: atom =>
            atom.properties &&
            ["protein", "dna", "rna"].includes(atom.properties.role)
        },
        true,
        atom => setSequenceHighlight(atom),
        () => clearSequenceHighlight()
      );
      buildSequenceTracks();
      buildVisibilityControls();
      updatePlddtButton();
      updateSampleSummary();
      drawPae();
      const config = customViews.get(activeViewId) || builtInConfig(activeViewId);
      setActiveButton(activeViewId);
      applyScene(config, preserveCamera);
      root.dataset.vizState = "ready";
    }

    function initialize() {
      if (!window.$3Dmol) {
        initializeAttempts += 1;
        if (initializeAttempts > 80) {
          root.dataset.vizState = "error";
          status.textContent = "内置分子渲染引擎加载失败。";
          return;
        }
        status.textContent = "分子渲染引擎正在加载…";
        window.setTimeout(initialize, 120);
        return;
      }

      selectInitialSample();
      assignSample(activeSample);
      documentTitle.textContent = viewerPayload.title || activeSample.title || "";
      buildSampleControls();
      viewer = $3Dmol.createViewer(stage, {
        backgroundColor: colors.background,
        antialias: true
      });
      viewer.setViewStyle({
        style: "outline",
        color: colors.foreground,
        width: 0.035
      });

      root.querySelectorAll("[data-builtin-view]").forEach(button => {
        button.addEventListener("click", () => {
          if (!editor.hidden) setEditorOpen(false);
          activateView(button.dataset.builtinView);
        });
      });
      sampleSelect.addEventListener("change", () => {
        try {
          if (!editor.hidden) setEditorOpen(false);
          loadSample(sampleSelect.value, true);
        } catch (error) {
          status.textContent = `样本切换失败：${error && error.message ? error.message : "未知错误"}`;
        }
      });
      sequenceFilter.addEventListener("change", buildSequenceTracks);
      paeCanvas.addEventListener("mousemove", handlePaePointer);
      paeCanvas.addEventListener("mouseleave", () => {
        paeTooltip.hidden = true;
        if (paeData) {
          paeStatus.textContent =
            "深绿表示低误差/高相对置信；悬停热图可查看真实 token 对 PAE。";
        }
      });
      addViewButton.addEventListener("click", () => {
        if (editor.hidden) {
          setEditorOpen(true);
        } else {
          cancelCustomView();
        }
      });
      root.querySelector("[data-action='cancel-view']")
        .addEventListener("click", cancelCustomView);
      root.querySelector("[data-action='bonds-off']")
        .addEventListener("click", () => closeDynamicBonds(true));
      root.querySelector("[data-action='reset-camera']").addEventListener("click", () => {
        if (dynamicBondState) closeDynamicBonds(false);
        const config = currentViewConfig();
        viewer.zoomTo({
          predicate: atom =>
            atom.properties &&
            atom.properties.role !== "water" &&
            isVisible(atom, config)
        });
        viewer.zoom(1.9, 500);
        viewer.render();
      });
      previewViewButton.addEventListener("click", () => {
        try {
          previewCustomView();
        } catch (error) {
          status.textContent = `自定义视图预览失败：${error && error.message ? error.message : "未知错误"}`;
        }
      });
      saveViewButton.addEventListener("click", () => {
        try {
          commitCustomView();
        } catch (error) {
          status.textContent = `自定义视图生成失败：${error && error.message ? error.message : "未知错误"}`;
        }
      });
      viewForm.addEventListener("input", () => {
        if (previewConfig) {
          resetPreviewState("设置已改变，请重新预览后再生成。");
        }
      });
      viewForm.addEventListener("submit", event => {
        event.preventDefault();
        previewCustomView();
      });

      resizeObserver = new ResizeObserver(() => {
        viewer.resize();
        viewer.render();
      });
      resizeObserver.observe(stage);
      loadSample(activeSample.id, false);
    }

    try {
      initialize();
    } catch (error) {
      root.dataset.vizState = "error";
      status.textContent =
        `可视化初始化失败：${error && error.message ? error.message : "未知错误"}`;
      console.error(error);
    }
  })();
</script>
