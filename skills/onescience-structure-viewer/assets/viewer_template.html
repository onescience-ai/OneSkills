<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE_PLACEHOLDER__ · 3D Viewer</title>
<!--
  Self-contained viewer generated by onescience-structure-viewer.
  3Dmol.js is pulled from CDN with a fallback mirror. Structure data is
  inlined below so the file works offline via file:// (only the JS lib
  needs network). If both CDNs fail, a text/JSON fallback is rendered.
-->
<script src="3Dmol-min.js"></script>
<script>
  if (typeof $3Dmol === "undefined") {
    document.write('<script src="https://cdn.jsdelivr.net/npm/3dmol@2.4.2/build/3Dmol-min.js"><\/script>');
  }
</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                            "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
               background: #0b0e1c; color: #e8ecf8; }
  #app { display: flex; height: 100vh; }
  #viewer-wrap { flex: 1; position: relative; background:
                 radial-gradient(ellipse at center, #1a1f3a 0%, #0b0e1c 75%); }
  #viewer { width: 100%; height: 100%; }
  #overlay-top { position: absolute; top: 12px; left: 16px; pointer-events: none;
                 font-size: 13px; color: #a8b0cc; text-shadow: 0 1px 3px #000; }
  #overlay-top .title { font-size: 16px; color: #e8ecf8; font-weight: 600; }
  #overlay-top .subtitle { font-size: 12px; margin-top: 2px; color: #8b93b8; }
  #overlay-bottom { position: absolute; bottom: 10px; left: 16px; font-size: 11px;
                    color: #6b7398; text-shadow: 0 1px 2px #000; pointer-events: none; }
  #fallback { display: none; position: absolute; inset: 0; padding: 24px;
              overflow: auto; background: #0b0e1c; font-family: monospace;
              font-size: 12px; color: #d8dcf0; }
  #fallback h2 { color: #ffcf6b; font-family: inherit; }

  #sidebar { width: 340px; background: #12162a; border-left: 1px solid #2a3050;
             display: flex; flex-direction: column; }
  #sidebar-header { padding: 14px 18px; border-bottom: 1px solid #2a3050;
                    background: #161a30; }
  #sidebar-header h1 { margin: 0; font-size: 15px; font-weight: 600; color: #e8ecf8; }
  #sidebar-header .meta { font-size: 11px; color: #8b93b8; margin-top: 4px;
                          font-family: "SF Mono", Consolas, monospace; }
  #sidebar-body { flex: 1; overflow-y: auto; padding: 12px 18px 24px; }
  #sidebar-body::-webkit-scrollbar { width: 6px; }
  #sidebar-body::-webkit-scrollbar-thumb { background: #2a3050; border-radius: 3px; }

  section { margin: 14px 0 18px; }
  section h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.4px;
               color: #6b7398; margin: 0 0 8px; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 13px; }
  .row label { cursor: pointer; user-select: none; flex: 1; }
  .swatch { width: 14px; height: 14px; border-radius: 50%; border: 1px solid #3a4060;
            display: inline-block; flex-shrink: 0; }
  button { background: #2d3555; color: #e8ecf8; border: 1px solid #3f4870;
           padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
           font-family: inherit; }
  button:hover { background: #3d4570; border-color: #556; }
  button:active { transform: translateY(1px); }
  button.primary { background: #4a5aa8; border-color: #6070c0; }
  button.primary:hover { background: #5a6ab8; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 6px; }
  input[type=range] { flex: 1; }
  input[type=radio] { accent-color: #7080d0; }
  input[type=checkbox] { accent-color: #7080d0; }
  code, pre { font-family: "SF Mono", Consolas, "Liberation Mono", monospace; }
  code { background: #1e2340; padding: 1px 5px; border-radius: 3px; font-size: 12px; }
  .notes { font-size: 12px; color: #b0b8d8; line-height: 1.55; }
  .notes ul { margin: 4px 0 4px 18px; padding: 0; }
  .notes li { margin: 2px 0; }
  .kv { display: grid; grid-template-columns: 100px 1fr; gap: 3px 8px;
        font-size: 12px; color: #b0b8d8; }
  .kv b { color: #8b93b8; font-weight: 500; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 10px;
           font-size: 10px; background: #2a3050; color: #a8b0cc; margin-right: 4px;
           border: 1px solid #3a4060; }
  .badge.fixed { background: #4a2020; color: #ffb0b0; border-color: #6a3030; }
  .hidden { display: none !important; }
  #error-banner { display: none; padding: 10px 14px; background: #4a2020;
                  border-bottom: 1px solid #6a3030; color: #ffb0b0; font-size: 12px; }
</style>
</head>
<body>
<div id="app">
  <div id="viewer-wrap">
    <div id="viewer"></div>
    <div id="overlay-top">
      <div class="title" id="ov-title">—</div>
      <div class="subtitle" id="ov-subtitle"></div>
    </div>
    <div id="overlay-bottom">
      <span id="ov-hint">drag: rotate · wheel: zoom · right-drag: pan · double-click: reset</span>
    </div>
    <div id="fallback"></div>
  </div>
  <aside id="sidebar">
    <div id="sidebar-header">
      <h1>Structure Inspector</h1>
      <div class="meta" id="hdr-meta">—</div>
    </div>
    <div id="error-banner"></div>
    <div id="sidebar-body">

      <section id="sec-summary">
        <h3>Summary</h3>
        <div class="kv" id="kv-summary"></div>
      </section>

      <section id="sec-style">
        <h3>Render style</h3>
        <div class="row"><label><input type="radio" name="style" value="ball" checked> Ball &amp; stick</label></div>
        <div class="row"><label><input type="radio" name="style" value="space"> Space fill</label></div>
        <div class="row"><label><input type="radio" name="style" value="stick"> Stick only</label></div>
        <div class="row"><label><input type="radio" name="style" value="line"> Line</label></div>
        <div class="row"><label>Atom size</label>
          <input type="range" id="rng-scale" min="0.2" max="1.6" step="0.05" value="1.0">
        </div>
        <div class="row"><label>Bond radius</label>
          <input type="range" id="rng-bond" min="0.05" max="0.35" step="0.01" value="0.14">
        </div>
      </section>

      <section id="sec-layers">
        <h3>Overlays</h3>
        <div class="row"><label><input type="checkbox" id="cb-cell" checked> Unit cell</label></div>
        <div class="row"><label><input type="checkbox" id="cb-bonds" checked> Bonds</label></div>
        <div class="row"><label><input type="checkbox" id="cb-fixed" checked> Highlight fixed atoms</label></div>
        <div class="row"><label><input type="checkbox" id="cb-labels"> Element labels</label></div>
        <div class="row"><label><input type="checkbox" id="cb-axes"> Cartesian axes</label></div>
      </section>

      <section id="sec-groups">
        <h3>Groups</h3>
        <div id="grp-list"></div>
      </section>

      <section id="sec-view">
        <h3>View</h3>
        <div class="btn-row">
          <button data-view="iso">Iso</button>
          <button data-view="top">Top (z)</button>
          <button data-view="front">Front (y)</button>
          <button data-view="side">Side (x)</button>
          <button data-view="reset">Reset</button>
        </div>
        <div class="btn-row" style="margin-top:6px">
          <button id="btn-png" class="primary">Export PNG</button>
          <button id="btn-center">Center on non-fixed</button>
        </div>
      </section>

      <section id="sec-legend">
        <h3>Elements</h3>
        <div id="legend"></div>
      </section>

      <section id="sec-notes">
        <h3>Notes</h3>
        <div class="notes" id="notes-body"></div>
      </section>

      <section id="sec-provenance">
        <h3>Provenance</h3>
        <div class="notes" id="prov-body" style="font-size:11px;color:#8b93b8"></div>
      </section>
    </div>
  </aside>
</div>

<script id="payload" type="application/json">__PAYLOAD_JSON__</script>
<script>
"use strict";

const PAYLOAD = JSON.parse(document.getElementById("payload").textContent);

// ---------------------------------------------------------------------------
// UI wiring that does not depend on 3Dmol
// ---------------------------------------------------------------------------
function fillStatic() {
  document.getElementById("ov-title").textContent = PAYLOAD.title || "structure";
  document.getElementById("ov-subtitle").textContent = PAYLOAD.subtitle || "";
  document.title = (PAYLOAD.title || "structure") + " · 3D Viewer";

  const L = PAYLOAD.cell_lengths, A = PAYLOAD.cell_angles;
  document.getElementById("hdr-meta").textContent =
    `${PAYLOAD.n_atoms} atoms · ${PAYLOAD.formula}`;

  const kv = document.getElementById("kv-summary");
  const rows = [
    ["Formula", PAYLOAD.formula],
    ["Atoms", `${PAYLOAD.n_atoms}` + (PAYLOAD.n_fixed ? ` (${PAYLOAD.n_fixed} fixed)` : "")],
    ["Cell", L ? `${L[0].toFixed(2)} × ${L[1].toFixed(2)} × ${L[2].toFixed(2)} Å` : "—"],
    ["Angles", A ? `${A[0].toFixed(1)}° ${A[1].toFixed(1)}° ${A[2].toFixed(1)}°` : "—"],
    ["Volume", PAYLOAD.volume ? `${PAYLOAD.volume.toFixed(1)} Å³` : "—"],
  ];
  const groups = countGroups(PAYLOAD.atoms);
  if (Object.keys(groups).length > 1) {
    rows.push(["Groups", Object.entries(groups)
      .map(([k, v]) => `${k}=${v}`).join(" · ")]);
  }
  rows.push(["Bonds", `${PAYLOAD.bonds.length}`]);
  kv.innerHTML = rows.map(([k, v]) => `<b>${k}</b><span>${v}</span>`).join("");

  // legend
  const legend = document.getElementById("legend");
  legend.innerHTML = PAYLOAD.elements_ordered.map(el => {
    const n = PAYLOAD.composition[el] || 0;
    const c = PAYLOAD.colors[el] || "#cccccc";
    return `<div class="row">
      <span class="swatch" style="background:${c}"></span>
      <label>${el}</label>
      <span style="color:#6b7398;font-size:11px">${n}</span>
    </div>`;
  }).join("");

  // notes
  const notes = document.getElementById("notes-body");
  notes.innerHTML = PAYLOAD.notes_html ||
    "<i>No notes supplied. Pass --contract / --gate-json / --notes to render_structure.py.</i>";

  // provenance
  const prov = document.getElementById("prov-body");
  const srcs = (PAYLOAD.source_files || []).map(f => `<div>· <code>${f}</code></div>`).join("");
  prov.innerHTML = srcs + `<div style="margin-top:6px">Generated by onescience-structure-viewer.</div>`;

  // groups panel
  const grpList = document.getElementById("grp-list");
  if (Object.keys(groups).length > 1) {
    grpList.innerHTML = Object.entries(groups).map(([g, n]) =>
      `<div class="row"><label><input type="checkbox" class="cb-group" data-group="${g}" checked>
       ${g}</label><span style="color:#6b7398;font-size:11px">${n}</span></div>`).join("");
    document.querySelectorAll(".cb-group").forEach(cb =>
      cb.addEventListener("change", () => applyStyles()));
  } else {
    document.getElementById("sec-groups").classList.add("hidden");
  }
}

function countGroups(atoms) {
  const out = {};
  for (const a of atoms) {
    const g = a.group || "other";
    out[g] = (out[g] || 0) + 1;
  }
  return out;
}

// ---------------------------------------------------------------------------
// Fallback if 3Dmol fails to load
// ---------------------------------------------------------------------------
function showFallback(reason) {
  const el = document.getElementById("fallback");
  el.style.display = "block";
  el.innerHTML = `
    <h2>3D renderer unavailable</h2>
    <p>${reason}</p>
    <p>The structure data is fully preserved in this file. Below is a plain-text
    dump you can copy into VESTA / OVITO / ASE-GUI, or open the sibling
    <code>structure.json</code> in any tool.</p>
    <h3>Cell</h3><pre>${JSON.stringify(PAYLOAD.cell, null, 2)}</pre>
    <h3>Composition</h3><pre>${PAYLOAD.formula} — ${PAYLOAD.n_atoms} atoms</pre>
    <h3>Atoms (Cartesian, Å)</h3>
    <pre>${PAYLOAD.atoms.map((a, i) =>
      `${String(i).padStart(4)} ${a.el.padEnd(3)} ${a.xyz.map(v => v.toFixed(4).padStart(10)).join(" ")}${a.fixed ? "  [fixed]" : ""}${a.group ? "  (" + a.group + ")" : ""}`
    ).join("\n")}</pre>
  `;
  document.getElementById("error-banner").style.display = "block";
  document.getElementById("error-banner").textContent =
    "⚠ 3D renderer failed to load (" + reason + "). Showing text fallback.";
}

// ---------------------------------------------------------------------------
// 3D scene
// ---------------------------------------------------------------------------
let viewer = null;
let cellShapes = [];
let axesShapes = [];
let labelShapes = [];
let bondShapes = [];
let modelRef = null;

function vecAdd(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
function vecScale(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }

function initViewer() {
  if (typeof $3Dmol === "undefined") {
    showFallback("$3Dmol is undefined — CDN blocked or offline.");
    return;
  }
  const cfg = {
    backgroundColor: "#0b0e1c",
    backgroundAlpha: 1.0,
    antialias: true,
    nomouse: false,
  };
  viewer = $3Dmol.createViewer(document.getElementById("viewer"), cfg);

  // Load atoms via XYZ (universally supported, no ambiguity in element parsing)
  // and draw bonds ourselves from PAYLOAD.bonds, so the viewer never re-runs
  // its own bond perception and never hairballs the metal slab.
  const xyz = buildXYZ();
  modelRef = viewer.addModel(xyz, "xyz");
  applyStyles();
  drawCell();
  viewer.zoomTo();
  viewer.render();

  // Double-click to reset
  document.getElementById("viewer").addEventListener("dblclick", () => {
    viewer.zoomTo(); viewer.render();
  });

  wireControls();
}

function buildXYZ() {
  const lines = [String(PAYLOAD.atoms.length), PAYLOAD.title || "structure"];
  for (const a of PAYLOAD.atoms) {
    lines.push(`${a.el} ${a.xyz[0].toFixed(6)} ${a.xyz[1].toFixed(6)} ${a.xyz[2].toFixed(6)}`);
  }
  return lines.join("\n");
}

function currentStyleName() {
  const r = document.querySelector('input[name="style"]:checked');
  return r ? r.value : "ball";
}

function groupVisible(g) {
  const cb = document.querySelector(`.cb-group[data-group="${g}"]`);
  return cb ? cb.checked : true;
}

function applyStyles() {
  if (!viewer || !modelRef) return;
  const styleName = currentStyleName();
  const scale = parseFloat(document.getElementById("rng-scale").value);
  const bondR = parseFloat(document.getElementById("rng-bond").value);
  const showBonds = document.getElementById("cb-bonds").checked;
  const highlightFixed = document.getElementById("cb-fixed").checked;

  // Disable 3Dmol's auto-detected bonds — we draw cylinders ourselves from
  // PAYLOAD.bonds so metal slabs never hairball and periodic-wrap bonds stay
  // correct (unwrap_molecules has already fixed the atom positions).
  const allAtoms = modelRef.selectedAtoms({});
  for (const at of allAtoms) { at.bonds = []; }

  viewer.setStyle({}, {});   // clear

  // Base style per atom
  for (const at of allAtoms) {
    // 3Dmol.js exposes the element symbol as `.elem` (not `.element`).
    const el = at.elem || at.element || "X";
    const color = PAYLOAD.colors[el] || "#cccccc";
    const idx = at.index;
    const data = PAYLOAD.atoms[idx];
    if (!data) continue;
    const visible = groupVisible(data.group || "other");

    const sel = { index: idx };
    if (!visible) {
      viewer.setStyle(sel, {});   // hide
      continue;
    }
    const st = {};
    const radius = (PAYLOAD.radii[el] || 0.7) * scale;

    if (styleName === "ball" || styleName === "space") {
      st.sphere = {
        radius: styleName === "space" ? radius * 1.7 : radius,
        color: color,
      };
    }
    if (styleName === "stick") {
      // stick-only: small sphere at atom center + bond cylinders (drawn below)
      st.sphere = { radius: bondR * 1.05, color: color };
    }
    if (styleName === "line") {
      st.line = { color: color };
    }
    // Dim fixed atoms if highlight enabled
    if (highlightFixed && data.fixed) {
      if (st.sphere) {
        st.sphere.color = shade(color, -0.55);
        st.sphere.radius = st.sphere.radius * 0.82;
      }
      if (st.line) st.line.color = shade(color, -0.4);
    }
    viewer.setStyle(sel, st);
  }

  drawBonds();

  // Labels
  for (const s of labelShapes) { try { viewer.removeShape(s); } catch(e){} }
  labelShapes = [];
  if (document.getElementById("cb-labels").checked) {
    PAYLOAD.atoms.forEach((a, i) => {
      if (!groupVisible(a.group || "other")) return;
      labelShapes.push(viewer.addLabel(a.el, {
        position: { x: a.xyz[0], y: a.xyz[1], z: a.xyz[2] },
        fontSize: 12,
        fontColor: "#ffffff",
        backgroundColor: "#141932",
        backgroundOpacity: 0.65,
        borderThickness: 0,
        showBackground: true,
        inFront: true,
      }));
    });
  }

  viewer.render();
}

function drawBonds() {
  if (!viewer) return;
  for (const s of bondShapes) { try { viewer.removeShape(s); } catch(e){} }
  bondShapes = [];
  const styleName = currentStyleName();
  if (!document.getElementById("cb-bonds").checked) return;
  if (styleName === "space") return;   // space-fill hides bonds on purpose
  const bondR = parseFloat(document.getElementById("rng-bond").value);
  const highlightFixed = document.getElementById("cb-fixed").checked;

  for (const [i, j, _d] of PAYLOAD.bonds) {
    const ai = PAYLOAD.atoms[i], aj = PAYLOAD.atoms[j];
    if (!ai || !aj) continue;
    if (!groupVisible(ai.group || "other")) continue;
    if (!groupVisible(aj.group || "other")) continue;
    const ci = PAYLOAD.colors[ai.el] || "#cccccc";
    const cj = PAYLOAD.colors[aj.el] || "#cccccc";
    let c1 = ci, c2 = cj;
    if (highlightFixed && (ai.fixed || aj.fixed)) {
      c1 = shade(ci, -0.4); c2 = shade(cj, -0.4);
    }
    const mid = {
      x: (ai.xyz[0] + aj.xyz[0]) / 2,
      y: (ai.xyz[1] + aj.xyz[1]) / 2,
      z: (ai.xyz[2] + aj.xyz[2]) / 2,
    };
    const r = styleName === "line" ? bondR * 0.35 : bondR;
    // Two-segment cylinder (each half colored by its own atom)
    bondShapes.push(viewer.addCylinder({
      start: { x: ai.xyz[0], y: ai.xyz[1], z: ai.xyz[2] },
      end: mid, radius: r, color: c1, fromCap: 1, toCap: 0,
    }));
    bondShapes.push(viewer.addCylinder({
      start: mid,
      end: { x: aj.xyz[0], y: aj.xyz[1], z: aj.xyz[2] },
      radius: r, color: c2, fromCap: 0, toCap: 1,
    }));
  }
}

function shade(hex, amount) {
  // amount in [-1, 1]: negative = darker
  const m = /^#([0-9a-f]{6})$/i.exec(hex);
  if (!m) return hex;
  const n = parseInt(m[1], 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const f = (v) => amount < 0
    ? Math.max(0, Math.round(v * (1 + amount)))
    : Math.min(255, Math.round(v + (255 - v) * amount));
  r = f(r); g = f(g); b = f(b);
  return "#" + ((r << 16) | (g << 8) | b).toString(16).padStart(6, "0");
}

function drawCell() {
  if (!viewer) return;
  for (const s of cellShapes) { try { viewer.removeShape(s); } catch(e){} }
  cellShapes = [];
  if (!document.getElementById("cb-cell").checked || !PAYLOAD.has_cell) return;
  const [A, B, C] = PAYLOAD.cell;
  const O = [0, 0, 0];
  const AB = vecAdd(A, B), AC = vecAdd(A, C), BC = vecAdd(B, C);
  const ABC = vecAdd(A, BC);
  const edges = [
    [O, A], [B, AB], [C, AC], [BC, ABC],
    [O, B], [A, AB], [C, BC], [AC, ABC],
    [O, C], [A, AC], [B, BC], [AB, ABC],
  ];
  for (const [p, q] of edges) {
    cellShapes.push(viewer.addCylinder({
      start: { x: p[0], y: p[1], z: p[2] },
      end:   { x: q[0], y: q[1], z: q[2] },
      radius: 0.08, color: "#4a5578", opacity: 0.85,
      fromCap: 1, toCap: 1,
    }));
  }
}

function drawAxes() {
  if (!viewer) return;
  for (const s of axesShapes) { try { viewer.removeShape(s); } catch(e){} }
  axesShapes = [];
  if (!document.getElementById("cb-axes").checked) return;
  const len = 3.0;
  const origin = { x: 0, y: 0, z: 0 };
  const specs = [
    [{ x: len, y: 0, z: 0 }, "#ff6060", "X"],
    [{ x: 0, y: len, z: 0 }, "#60ff60", "Y"],
    [{ x: 0, y: 0, z: len }, "#6090ff", "Z"],
  ];
  for (const [end, color, label] of specs) {
    axesShapes.push(viewer.addCylinder({
      start: origin, end: end, radius: 0.06, color: color,
      fromCap: 1, toCap: 2,
    }));
    axesShapes.push(viewer.addLabel(label, {
      position: end, fontSize: 14, fontColor: color,
      backgroundColor: "rgba(0,0,0,0)", showBackground: false,
      borderThickness: 0, inFront: true,
    }));
  }
}

function quatAxisAngle(ax, ay, az, deg) {
  const t = (deg * Math.PI / 180) / 2;
  const s = Math.sin(t);
  return [ax * s, ay * s, az * s, Math.cos(t)];
}
function quatMul(a, b) {
  return [
    a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
    a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
    a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
    a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2],
  ];
}
function cellCenter() {
  if (!PAYLOAD.has_cell) {
    // fall back to atom bbox center
    let mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9];
    for (const a of PAYLOAD.atoms) for (let k = 0; k < 3; k++) {
      mn[k] = Math.min(mn[k], a.xyz[k]); mx[k] = Math.max(mx[k], a.xyz[k]);
    }
    return [(mn[0] + mx[0]) / 2, (mn[1] + mx[1]) / 2, (mn[2] + mx[2]) / 2];
  }
  const [A, B, C] = PAYLOAD.cell;
  return [(A[0] + B[0] + C[0]) / 2, (A[1] + B[1] + C[1]) / 2, (A[2] + B[2] + C[2]) / 2];
}

function setView(name) {
  if (!viewer) return;
  // Explicit quaternion per orientation. 3Dmol's default camera looks down -z
  // with +y up, so identity = "top" for a slab whose surface normal is +z.
  let q;
  if (name === "top" || name === "reset") {
    q = [0, 0, 0, 1];
  } else if (name === "side") {
    // camera from +x looking along -x: rotate scene -90° about y
    q = quatAxisAngle(0, 1, 0, -90);
  } else if (name === "front") {
    // camera from +y looking along -y: rotate scene +90° about x
    q = quatAxisAngle(1, 0, 0, 90);
  } else { // iso
    q = quatMul(quatAxisAngle(0, 1, 0, 35), quatAxisAngle(1, 0, 0, -65));
  }
  const c = cellCenter();
  // setView([px,py,pz, qx,qy,qz,qw, zoom]); zoom=1 then let zoomTo fit
  viewer.setView([c[0], c[1], c[2], q[0], q[1], q[2], q[3], 1]);
  viewer.zoomTo();
  viewer.render();
}

function centerOnNonFixed() {
  if (!viewer) return;
  const atoms = PAYLOAD.atoms.filter(a => !a.fixed);
  const target = atoms.length ? atoms : PAYLOAD.atoms;
  if (!target.length) { viewer.zoomTo(); viewer.render(); return; }
  let sx = 0, sy = 0, sz = 0;
  for (const a of target) { sx += a.xyz[0]; sy += a.xyz[1]; sz += a.xyz[2]; }
  const n = target.length;
  const c = { x: sx / n, y: sy / n, z: sz / n };
  // Preserve current rotation + zoom, just recenter
  const v = viewer.getView();   // [px, py, pz, qx, qy, qz, qw, zoom]
  viewer.setView([c.x, c.y, c.z, v[3], v[4], v[5], v[6], v[7]]);
  viewer.render();
}

function exportPNG() {
  if (!viewer) return;
  try {
    const url = viewer.pngURI();
    const a = document.createElement("a");
    a.href = url;
    a.download = (PAYLOAD.title || "structure").replace(/[^\w.-]+/g, "_") + ".png";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  } catch (e) {
    alert("PNG export failed: " + e.message);
  }
}

function wireControls() {
  document.querySelectorAll('input[name="style"]').forEach(r =>
    r.addEventListener("change", applyStyles));
  for (const id of ["rng-scale", "rng-bond"]) {
    document.getElementById(id).addEventListener("input", applyStyles);
  }
  document.getElementById("cb-cell").addEventListener("change", drawCell);
  document.getElementById("cb-axes").addEventListener("change", drawAxes);
  for (const id of ["cb-bonds", "cb-fixed"]) {
    document.getElementById(id).addEventListener("change", applyStyles);
  }
  document.getElementById("cb-labels").addEventListener("change", applyStyles);
  document.querySelectorAll("[data-view]").forEach(b =>
    b.addEventListener("click", () => setView(b.dataset.view)));
  document.getElementById("btn-png").addEventListener("click", exportPNG);
  document.getElementById("btn-center").addEventListener("click", centerOnNonFixed);
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
fillStatic();
if (typeof $3Dmol === "undefined") {
  // give the fallback script tag one more chance
  window.addEventListener("load", () => {
    if (typeof $3Dmol === "undefined") {
      showFallback("3Dmol.js could not be loaded from CDN.");
    } else {
      initViewer();
    }
  });
} else {
  initViewer();
}
</script>
</body>
